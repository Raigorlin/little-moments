# 自訂 Semgrep 規則：禁止 `new Function` / `Function(...)`（Requirement 6.3；Design §10 SAST 列）。
#
# Function 建構子與 eval 等價（以字串建立並執行程式碼），本專案沒有正當用途，一律 ERROR
# （normalize.mjs 對應 High）。
# 範例檔：同目錄 lm-no-new-function.js（semgrep --test）。
rules:
  - id: lm-no-new-function
    languages: [javascript]
    severity: ERROR
    message: >-
      禁止使用 Function 建構子（new Function / Function(...)）由字串建立程式碼。請改用一般函式或查表。
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      requirements: ["6.3"]
      source: little-moments（自行撰寫）
    pattern-either:
      - pattern: new Function(...)
      - pattern: Function(...)
      - pattern: new $OBJ.Function(...)
      - pattern: $OBJ.Function(...)
