# lm-untrusted 的 rootless Docker 設定覆寫（Requirement 2.6；tasks 19.3）。
# 安裝為 ~lm-untrusted/.config/systemd/user/docker.service.d/override.conf，再以 lm-untrusted 身分執行
# `systemctl --user daemon-reload && systemctl --user restart docker`。
#
# Docker Engine 29.5 起 rootlesskit 預設 detach-netns，使 `docker run --net=host` 加入真正的主機網路
# （不經 slirp4netns），可繞過容器的網路隔離。關閉 detach-netns 並固定使用 slirp4netns，維持防火牆
# （lm-untrusted-fw）驗證時的 user-mode 網路：容器的所有連線都由 lm-untrusted 擁有的 slirp4netns 發出。
[Service]
Environment=DOCKERD_ROOTLESS_ROOTLESSKIT_DETACH_NETNS=false
Environment=DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns
