# Deploy_Host Compose 專案（Requirement 11.4、11.10、18.6、20.2、20.3；plan.md D5、D6、D12）。
#
# 每個環境一份獨立專案：以 `--env-file /srv/lm/<env>/<env>.env --env-file /srv/lm/<env>/app.env` 啟動，
# `name: lm-<env>` 使網路、卷與容器名稱皆以 lm-staging_／lm-prod_ 為前綴，兩環境不共用 Database、資料卷、
# 金鑰或網路。
#
#   docker compose -f compose.yaml --env-file prod.env --env-file app.env --profile green up -d app-green
#
# 檔案配置（由 deploy/host/install.sh 安裝，lm-deploy 操作）：
#   /srv/lm/<env>/compose.yaml   本檔
#   /srv/lm/<env>/<env>.env      Compose 變數（非秘密；範本見 staging.env.example／prod.env.example）
#   /srv/lm/<env>/app.env        0600 root；Supabase 的 8 個金鑰（LM_*；範本見 app.env.example，以
#                                deploy/bin/lm-supabase-keys 產生），只用於 ${...} 變數替換，不以 env_file 整份傳入容器
#   /srv/lm/<env>/supabase/      deploy/supabase/ 的 gateway.Caddyfile（API gateway）與 db-setup.sql（lm-deploy 執行）
#   /srv/lm/<env>/caddy/         deploy/caddy/ 的內容 + lm-deploy 產生的 upstream.caddy
#
# 映像一律以 `repo@sha256:<digest>` 引用（Req 17.7、20.1）。APP_IMAGE_* 由 lm-deploy 在每次呼叫時提供並驗證格式；
# 第三方映像以上游多平台 index 的 digest 固定（plan.md D5：與本機 Supabase CLI 3.2.0 的 supabase.lock 相同的
# ghcr.io/supabase/cli 映像，2026-11-25 經 ghcr API 確認），更新時 drill.yaml 一起修改。
#
# 服務：
#   proxy               LM_Proxy（Caddy）：唯一發布連接埠的服務；拒絕 LM_ALLOWED_HOSTS 以外的 Host（421）。
#   app-blue／app-green lm-server（App_Image：/app/bin/little-moments-server、/app/dist、/app/migrations；8080）。
#   db                  Supabase Postgres 17（初始化、角色與 Supabase 遷移由映像在首次啟動時完成）。
#   auth                GoTrue（`gotrue` 先 migrate 再 serve）。
#   realtime            Realtime（/app/entry.sh 先執行 prepare：遷移並建立 tenant realtime-dev）。
#   gateway             API gateway（與 proxy 相同的 Caddy 映像）：/auth/v1、/realtime/v1，檢查 apikey。
#
# 網路：
#   edge  一般 bridge，只有 proxy；唯一發布連接埠的服務，綁定 ${LAN_IP}。LAN 網段限制由
#         deploy/host 的 DOCKER-USER 規則在 Docker 轉送層生效（Req 8.6）。Production 另經同主機的
#         Edge_Proxy（Nginx Proxy Manager + Cloudflare）連到此連接埠；proxy 只採信 LM_EDGE_TRUSTED_PROXIES
#         （Edge_Trusted_Proxies）來源送來的 X-Forwarded-For／X-Forwarded-Proto（Req 25.1–25.6）。
#   app   internal、固定子網；proxy ↔ app-blue／app-green。
#   data  internal；app-blue／app-green ↔ db、gateway；gateway ↔ auth、realtime；auth、realtime ↔ db。
#         proxy 不在此網路，無法直接連線 Database 或 Supabase 服務。
# db、auth、realtime、gateway 與 app-* 都不宣告 ports，不發布到 Deploy_Host 任何介面（Req 11.10）。

name: lm-${LM_ENV:?LM_ENV 必須為 staging 或 prod}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

# Supabase 服務：不設 read_only（Postgres 寫 /run 與資料卷、Realtime 寫 /tmp 與 release 暫存），其餘與 hardening 相同。
x-supabase: &supabase
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  networks: [data]
  restart: unless-stopped

x-app: &app
  <<: *hardening
  # App_Image 已在映像內設定 USER 65532:65532；此處再次明確指定，避免被覆寫為 root。
  user: "65532:65532"
  environment:
    LM_BIND: 0.0.0.0:8080
    LM_STATIC_DIR: /app/dist
    # 同一 Compose internal 網路，不經過主機網路介面。postgres 是遷移與 App 使用的角色（plan.md D7）。
    DATABASE_URL: postgresql://postgres:${LM_DB_PASSWORD:?LM_DB_PASSWORD 未設定（app.env）}@db:5432/postgres?sslmode=disable
    SUPABASE_URL: http://gateway:8000
    SUPABASE_ANON_KEY: ${LM_ANON_KEY:?LM_ANON_KEY 未設定（app.env）}
    SUPABASE_SERVICE_KEY: ${LM_SERVICE_KEY:?LM_SERVICE_KEY 未設定（app.env）}
    SUPABASE_JWT_SECRET: ${LM_JWT_SECRET:?LM_JWT_SECRET 未設定（app.env）}
    LM_AUTH_EMAIL_DOMAIN: ${LM_AUTH_EMAIL_DOMAIN:-users.little-moments.invalid}
    # 不經邀請的註冊（plan.md D9）：Staging 為 true（smoke --provision），Production 為 false。
    LM_PUBLIC_SIGNUP: ${LM_PUBLIC_SIGNUP:-false}
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m
  networks: [app, data]
  depends_on:
    db:
      condition: service_healthy
    gateway:
      condition: service_started
  restart: unless-stopped
  # 略長於 Caddy grace_period 30s。
  stop_grace_period: 35s
  # distroless 映像沒有 shell 或 wget，不在容器內設 healthcheck。健康檢查由 lm-deploy 經 proxy 容器
  # 呼叫 http://app-<color>:8080/robots.txt（5 秒逾時；lm-server 沒有 /healthz）。
  deploy:
    resources:
      limits:
        cpus: "${APP_CPUS:-1.0}"
        memory: ${APP_MEMORY:-256M}
        pids: 256

services:
  proxy:
    <<: *hardening
    # digest 為 caddy:2.10.2-alpine 的多平台 index（`docker buildx imagetools inspect caddy:2.10.2-alpine`）。
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    # 官方 Caddy 映像的 /usr/bin/caddy 帶有 cap_net_bind_service 檔案能力；bounding set 不含該能力時
    # execve 會以 EPERM 失敗，因此只加回這一項。容器內監聽 8080／8443，不需要其他能力。
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "${LAN_IP:?LAN_IP 未設定}:${LM_PUBLIC_PORT:?LM_PUBLIC_PORT 未設定}:${LM_LISTEN_PORT:-8080}"
    environment:
      LM_SITE_ADDRESS: ${LM_SITE_ADDRESS:-http://:8080}
      LM_TLS_MODE: ${LM_TLS_MODE:-off}
      LM_HEALTH_HOST: ${LM_HEALTH_HOST:?LM_HEALTH_HOST 未設定}
      # Host 允許清單（plan.md D12）：以空白分隔；其他 Host 由 Caddyfile 回應 421。格式由 lm-deploy 驗證。
      LM_ALLOWED_HOSTS: ${LM_ALLOWED_HOSTS:?LM_ALLOWED_HOSTS 未設定}
      # Edge_Trusted_Proxies（Req 25.7）；未設定或為空字串時為 127.0.0.1/32，等同不信任任何來源（Req 25.6）。
      # 格式由 lm-deploy 驗證（Req 25.8）。變更後須重新建立 proxy 容器（up -d --no-deps proxy）。
      LM_EDGE_TRUSTED_PROXIES: ${LM_EDGE_TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      # 掛載整個目錄（唯讀）：lm-deploy switch 在主機端以 rename 原子更新 upstream.caddy，
      # 目錄 bind mount 才能看見新的 inode（單檔 bind mount 會停留在舊檔）。
      - ${LM_CADDY_DIR:-./caddy}:/etc/caddy:ro
      # tls internal 模式的 CA 與憑證存放處；http 模式下為空。
      - caddy_data:/data
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=1m
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    networks:
      edge: {}
      app:
        ipv4_address: ${PROXY_IP}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 128

  app-blue:
    <<: *app
    image: ${APP_IMAGE_BLUE:?APP_IMAGE_BLUE 未設定（repo@sha256:...）}
    profiles: [blue]

  app-green:
    <<: *app
    image: ${APP_IMAGE_GREEN:?APP_IMAGE_GREEN 未設定（repo@sha256:...）}
    profiles: [green]

  db:
    <<: *supabase
    # ghcr.io/supabase/cli/postgres:17.12.0.000-r0 的多平台 index（plan.md D5）；必須與 drill.yaml 的 db 相同。
    image: ghcr.io/supabase/cli/postgres:17.12.0.000-r0@sha256:f76f17ab40da704b0ab60c012277144e93abf85e396c26f9a272d7b5bd20073f
    # 映像以 root 啟動 /usr/local/bin/docker-entrypoint.sh：建立 /run/postgresql 並 chown／chmod 給 postgres（100:101），
    # 再以 busybox su 降為 postgres 執行 initdb、Supabase 遷移與伺服器，因此只加回這四項能力。
    cap_add: [CHOWN, FOWNER, SETUID, SETGID]
    environment:
      # 首次初始化時設定 supabase_admin（initdb）與 postgres（migrate.sh）的密碼；其他角色與 JWT 設定由
      # lm-deploy 每次部署以 deploy/supabase/db-setup.sql（psql \getenv 讀取下列變數）設定。
      POSTGRES_PASSWORD: ${LM_DB_PASSWORD:?LM_DB_PASSWORD 未設定（app.env）}
      JWT_SECRET: ${LM_JWT_SECRET:?LM_JWT_SECRET 未設定（app.env）}
      JWT_EXP: "3600"
    volumes:
      # 容器外具名卷 lm-<env>_sbdata：`docker compose down`（不加 -v）或替換映像後資料仍在（Req 11.4）。
      # Bun 版本的 lm-<env>_pgdata 不再掛載，保留原狀（plan.md D6、D11）。新卷複製映像中
      # /var/lib/postgresql/data 的擁有者（postgres 100:101），首次 initdb 可寫入。
      - sbdata:/var/lib/postgresql/data
    shm_size: 128m
    # 不宣告 ports（Req 11.10）。pg_hba：容器內 socket 與 127.0.0.1 為 trust，其他來源為 scram-sha-256。
    healthcheck:
      # 首次啟動的暫時伺服器只監聽私有 socket，因此 TCP 就緒即代表初始化與 Supabase 遷移已完成。
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432", "-U", "supabase_admin", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 120s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-1.0}"
          memory: ${DB_MEMORY:-1G}
          pids: 256

  auth:
    <<: *supabase
    # ghcr.io/supabase/cli/auth:v2.198.0-r0 的多平台 index（plan.md D5）；映像以 1000:1000 執行 `gotrue`
    # （先 migrate 再 serve），內含 busybox wget。
    image: ghcr.io/supabase/cli/auth:v2.198.0-r0@sha256:6119529b17c2b335fdeb49673cbb5d602bf5e4368d1f1032ba11bc4bfd24b850
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    # 與本機 ~/lm-spike/stack.sh auth_env 相同（plan.md D6），位址改為 Compose 服務名稱。
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://gateway:8000/auth/v1
      GOTRUE_JWT_ISSUER: http://gateway:8000/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${LM_DB_PASSWORD:?LM_DB_PASSWORD 未設定（app.env）}@db:5432/postgres
      GOTRUE_DB_MAX_POOL_SIZE: "2"
      GOTRUE_DB_MAX_IDLE_POOL_SIZE: "2"
      GOTRUE_SITE_URL: ${LM_SITE_URL:?LM_SITE_URL 未設定}
      GOTRUE_URI_ALLOW_LIST: ""
      GOTRUE_JWT_SECRET: ${LM_JWT_SECRET:?LM_JWT_SECRET 未設定（app.env）}
      GOTRUE_JWT_KEYS: ${LM_JWT_KEYS:?LM_JWT_KEYS 未設定（app.env）}
      GOTRUE_JWT_VALIDMETHODS: HS256,RS256,ES256
      GOTRUE_JWT_VALID_METHODS: HS256,RS256,ES256
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # 註冊只經 lm-server 以 service_role 呼叫 Auth 的 admin API（LM_PUBLIC_SIGNUP 由 lm-server 判斷）。
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "false"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_PASSWORD_MIN_LENGTH: "6"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "360000"
      GOTRUE_RATE_LIMIT_SMS_SENT: "30"
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: "30"
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "150"
      GOTRUE_RATE_LIMIT_OTP: "30"
      GOTRUE_RATE_LIMIT_VERIFY: "30"
      GOTRUE_RATE_LIMIT_WEB3: "30"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${AUTH_CPUS:-0.5}"
          memory: ${AUTH_MEMORY:-128M}
          pids: 128

  realtime:
    <<: *supabase
    # ghcr.io/supabase/cli/realtime:v2.167.0-r0 的多平台 index（plan.md D5）；映像以 65532:65532 執行
    # /app/entry.sh：SEED_SELF_HOST=true 時以 Realtime.OneShotPrepare 遷移 _realtime 並建立 tenant，再啟動伺服器。
    image: ghcr.io/supabase/cli/realtime:v2.167.0-r0@sha256:7a052b1772f830e6496fd8a84ea7179514584186a331c935a58d2bcb49a3cfc9
    # 與本機 ~/lm-spike/stack.sh realtime_env 相同（plan.md D6），位址改為 Compose 服務名稱。
    environment:
      PORT: "4000"
      PHX_HTTP_IP: 0.0.0.0
      DATABASE_URL: postgres://supabase_admin:${LM_DB_PASSWORD:?LM_DB_PASSWORD 未設定（app.env）}@db:5432/postgres
      DB_URL: postgres://supabase_admin:${LM_DB_PASSWORD:?LM_DB_PASSWORD 未設定（app.env）}@db:5432/postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${LM_DB_PASSWORD:?LM_DB_PASSWORD 未設定（app.env）}
      DB_NAME: postgres
      DB_IP_VERSION: ipv4
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      API_JWT_SECRET: ${LM_JWT_SECRET:?LM_JWT_SECRET 未設定（app.env）}
      API_JWT_JWKS: ${LM_JWKS:?LM_JWKS 未設定（app.env）}
      METRICS_JWT_SECRET: ${LM_JWT_SECRET:?LM_JWT_SECRET 未設定（app.env）}
      DB_ENC_KEY: ${LM_REALTIME_DB_ENC_KEY:?LM_REALTIME_DB_ENC_KEY 未設定（app.env）}
      SECRET_KEY_BASE: ${LM_REALTIME_SECRET_KEY_BASE:?LM_REALTIME_SECRET_KEY_BASE 未設定（app.env）}
      DNS_NODES: "''"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      SELF_HOST_TENANT_NAME: realtime-dev
      RUN_JANITOR: "true"
      MAX_HEADER_LENGTH: "4096"
      ERL_AFLAGS: -proto_dist inet_tcp
      ERL_MAX_PORTS: "65536"
      GEN_RPC_TCP_SERVER_PORT: "5369"
      GEN_RPC_TCP_CLIENT_PORT: "5369"
      GEN_RPC_SOCKET_IP: 127.0.0.1
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${REALTIME_CPUS:-1.0}"
          memory: ${REALTIME_MEMORY:-512M}
          pids: 512

  gateway:
    <<: *supabase
    # 與 proxy 相同的 Caddy 映像（plan.md D5）；路由與 apikey 檢查見 deploy/supabase/gateway.Caddyfile。
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    read_only: true
    # 理由同 proxy（/usr/bin/caddy 的檔案能力）；只監聽 8000。
    cap_add: [NET_BIND_SERVICE]
    environment:
      LM_ANON_KEY: ${LM_ANON_KEY:?LM_ANON_KEY 未設定（app.env）}
      LM_SERVICE_KEY: ${LM_SERVICE_KEY:?LM_SERVICE_KEY 未設定（app.env）}
    volumes:
      - ./supabase/gateway.Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=1m
      - /data:rw,noexec,nosuid,nodev,size=1m
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: ${GATEWAY_MEMORY:-64M}
          pids: 128

networks:
  edge: {}
  app:
    internal: true
    ipam:
      config:
        - subnet: ${APP_SUBNET:?APP_SUBNET 未設定}
  data:
    internal: true

volumes:
  sbdata: {}
  caddy_data: {}
