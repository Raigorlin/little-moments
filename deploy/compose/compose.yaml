# Deploy_Host Compose 專案（Requirement 11.4、11.10、15.6、18.6、20.2、20.3；design.md Components §12）。
#
# 每個環境一份獨立專案：以 `--env-file /srv/lm/<env>/<env>.env` 啟動，`name: lm-<env>` 使
# 網路、卷與容器名稱皆以 lm-staging_／lm-prod_ 為前綴，兩環境不共用 Database、資料卷或網路。
#
#   docker compose -f compose.yaml --env-file prod.env --profile green up -d app-green
#
# 檔案配置（由 deploy/host/install.sh 安裝，lm-deploy 操作）：
#   /srv/lm/<env>/compose.yaml   本檔
#   /srv/lm/<env>/<env>.env      Compose 變數（非秘密；範本見 staging.env.example／prod.env.example）
#   /srv/lm/<env>/app.env        0600 root；App 的 DB 憑證與 Setup_Token（範本見 app.env.example）
#   /srv/lm/<env>/db.env         0600 root；PostgreSQL 初始化憑證（範本見 db.env.example）
#   /srv/lm/<env>/caddy/         deploy/caddy/ 的內容 + lm-deploy 產生的 upstream.caddy
#   /srv/lm/prod/secrets/openai-api-key  只有 Production；10001:10001 0400，由 lm-deploy deploy 寫入（secrets/ 為 root 0700）
#
# 映像一律以 `repo@sha256:<digest>` 引用（Req 17.7、20.1）。APP_IMAGE_* 由 lm-deploy 在每次呼叫時
# 提供並驗證格式；第三方映像（proxy、db）以上游多平台 index 的 digest 固定，見下方註解。
#
# 網路：
#   edge  一般 bridge，只有 proxy；唯一發布連接埠的服務，綁定 ${LAN_IP}。LAN 網段限制由
#         deploy/host 的 DOCKER-USER 規則在 Docker 轉送層生效（Req 8.6）。Production 另經同主機的
#         Edge_Proxy（Nginx Proxy Manager + Cloudflare）連到此連接埠；proxy 只採信 LM_EDGE_TRUSTED_PROXIES
#         （Edge_Trusted_Proxies）來源送來的 X-Forwarded-For／X-Forwarded-Proto（Req 25.1–25.6）。
#   app   internal、固定子網；proxy ↔ app-blue／app-green。proxy 使用固定 IP，App 只採信該 /32
#         的 X-Forwarded-*（Req 9.12、25.10；design Open Risks 6：不得設為整個 LAN 網段），
#         不論 LM_EDGE_TRUSTED_PROXIES 的內容。
#   data  internal；app-blue／app-green／migrate ↔ db。proxy 不在此網路，無法直接連線 Database。
# db 不宣告 ports，不發布到 Deploy_Host 任何介面（Req 11.10）。

name: lm-${LM_ENV:?LM_ENV 必須為 staging 或 prod}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

x-app: &app
  <<: *hardening
  # App_Image 已在映像內設定 USER 10001:10001；此處再次明確指定，避免被覆寫為 root。
  user: "10001:10001"
  env_file: [app.env]
  environment:
    NODE_ENV: production
    CAMPING_BIND_ADDRESS: 0.0.0.0
    PORT: "5173"
    CAMPING_ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS 未設定}
    CAMPING_TRUSTED_PROXIES: ${PROXY_IP:?PROXY_IP 未設定}/32
    CAMPING_DATABASE_HOST: db
    CAMPING_DATABASE_PORT: "5432"
    # 同一 Compose internal 網路，不經過主機網路介面（design Components §1 預設 disable）。
    CAMPING_DATABASE_SSLMODE: disable
    CAMPING_DIST: /app/dist
    CAMPING_MIGRATIONS_DIR: /app/migrations
    # 公開註冊政策（Req 26.16）：這只是啟動初始值（Registration_Seed），未設定或空字串時為 closed，
    # 帳號只能經旅行邀請連結建立。管理員在 /admin 儲存的值優先，儲存後此值不再生效。
    CAMPING_REGISTRATION: ${CAMPING_REGISTRATION:-closed}
    # 雲端 AI 收據辨識（OpenAI；Req 15.6、15.7；design.md Components §25）：金鑰只以金鑰檔提供，
    # CAMPING_OPENAI_API_KEY 固定為空字串。CAMPING_OPENAI_API_KEY_FILE 由 lm-deploy 每次執行時以呼叫端環境傳入：
    # Production 的 /srv/lm/prod/secrets/openai-api-key 存在時為 /run/secrets/openai-api-key（下方 x-openai-key
    # 的掛載），否則為空字串（Staging 一律為空字串），App 沒有可用的金鑰即停用。金鑰內容只來自 release/ 的
    # Credential_Store（lm-prod-openai-api-key），經 Production Deploy 的 stdin 交給 lm-deploy。其他 CAMPING_OPENAI_*
    # 維持空字串（App 使用預設值）；<env>.env 中這些變數的非空值會被 lm-deploy 拒絕。
    CAMPING_OPENAI_API_KEY: ""
    CAMPING_OPENAI_API_KEY_FILE: ${CAMPING_OPENAI_API_KEY_FILE:-}
    CAMPING_OPENAI_MODEL_ID: ${CAMPING_OPENAI_MODEL_ID:-}
    CAMPING_OPENAI_IMAGE_DETAIL: ${CAMPING_OPENAI_IMAGE_DETAIL:-}
    CAMPING_OPENAI_MAX_COMPLETION_TOKENS: ${CAMPING_OPENAI_MAX_COMPLETION_TOKENS:-}
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m
  networks: [app, data]
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  # 收到 SIGTERM 後 serve.mjs 停止接受新連線並在 5 秒內關閉連線池；略長於 Caddy grace_period 30s。
  stop_grace_period: 35s
  # distroless 映像沒有 shell 或 wget，不在容器內設 healthcheck。健康檢查由 lm-deploy 經 proxy 容器
  # 呼叫 http://app-<color>:5173/healthz（5 秒逾時，design Components §12）。
  deploy:
    resources:
      limits:
        cpus: "${APP_CPUS:-1.0}"
        memory: ${APP_MEMORY:-512M}
        pids: 256

# 收據 AI 的金鑰檔（design.md Components §25.5）：只掛載到 app-blue／app-green（不含 migrate、proxy、db）。
# 來源由 lm-deploy 決定：金鑰檔存在時為 /srv/lm/prod/secrets/openai-api-key，否則為 /dev/null（停用時的佔位）。
# 長語法加 create_host_path: false：來源不存在時 up 直接失敗，不會由 Docker 建立目錄（短語法會建立目錄，
# App 讀取時得到 EISDIR）。單檔 bind mount 停留在建立容器時的 inode，輪替在下一次部署的新槽位生效。
x-openai-key: &openai_key
  type: bind
  source: ${LM_OPENAI_KEY_SOURCE:-/dev/null}
  target: /run/secrets/openai-api-key
  read_only: true
  bind:
    create_host_path: false

services:
  proxy:
    <<: *hardening
    # digest 為 caddy:2.10.2-alpine 的多平台 index（`docker buildx imagetools inspect caddy:2.10.2-alpine`）。
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    # 官方 Caddy 映像的 /usr/bin/caddy 帶有 cap_net_bind_service 檔案能力；bounding set 不含該能力時
    # execve 會以 EPERM 失敗，因此只加回這一項。容器內監聽 8080／8443，不需要其他能力。
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "${LAN_IP:?LAN_IP 未設定}:${LM_PUBLIC_PORT:?LM_PUBLIC_PORT 未設定}:${LM_LISTEN_PORT:-8080}"
    environment:
      LM_SITE_ADDRESS: ${LM_SITE_ADDRESS:-http://:8080}
      LM_TLS_MODE: ${LM_TLS_MODE:-off}
      LM_HEALTH_HOST: ${LM_HEALTH_HOST:?LM_HEALTH_HOST 未設定}
      # Edge_Trusted_Proxies（Req 25.7）；未設定或為空字串時為 127.0.0.1/32，等同不信任任何來源（Req 25.6）。
      # 格式由 lm-deploy 驗證（Req 25.8）。變更後須重新建立 proxy 容器（up -d --no-deps proxy）。
      LM_EDGE_TRUSTED_PROXIES: ${LM_EDGE_TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      # 掛載整個目錄（唯讀）：lm-deploy switch 在主機端以 rename 原子更新 upstream.caddy，
      # 目錄 bind mount 才能看見新的 inode（單檔 bind mount 會停留在舊檔）。
      - ${LM_CADDY_DIR:-./caddy}:/etc/caddy:ro
      # tls internal 模式的 CA 與憑證存放處；http 模式下為空。
      - caddy_data:/data
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=1m
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    networks:
      edge: {}
      app:
        ipv4_address: ${PROXY_IP}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 128

  app-blue:
    <<: *app
    image: ${APP_IMAGE_BLUE:?APP_IMAGE_BLUE 未設定（repo@sha256:...）}
    profiles: [blue]
    volumes: [*openai_key]

  app-green:
    <<: *app
    image: ${APP_IMAGE_GREEN:?APP_IMAGE_GREEN 未設定（repo@sha256:...）}
    profiles: [green]
    volumes: [*openai_key]

  # Migration_Runner：以新版 App_Image 執行一次後結束（Req 18.2）；回滾時不執行（Req 20.9）。
  migrate:
    <<: *app
    image: ${APP_IMAGE_NEW:?APP_IMAGE_NEW 未設定（repo@sha256:...）}
    entrypoint: ["bun", "/app/server/migrate.js"]
    networks: [data]
    restart: "no"
    profiles: [ops]

  db:
    <<: *hardening
    # digest 為 postgres:17.6-bookworm 的多平台 index（`docker buildx imagetools inspect postgres:17.6-bookworm`）；
    # 必須與 drill.yaml 的 db 及 Jenkinsfile 的 LM_POSTGRES_IMAGE 相同。
    # 主要版本須與 lm-deploy 使用的 pg_dump／pg_restore 一致（17）。
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    # 以映像內 postgres 帳號（999:999）直接執行：entrypoint 不需 chown／gosu，因此可 cap_drop ALL。
    # 新建立的具名卷會複製映像中 /var/lib/postgresql/data 的擁有者（postgres），首次 initdb 可寫入。
    user: "999:999"
    env_file: [db.env]
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # 容器外具名卷 lm-<env>_pgdata：`docker compose down`（不加 -v）或替換映像後資料仍在（Req 11.4）。
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:rw,noexec,nosuid,nodev,mode=1777,size=1m
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m
    shm_size: 128m
    # 不宣告 ports（Req 11.10）。
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-1.0}"
          memory: ${DB_MEMORY:-1G}
          pids: 256

networks:
  edge: {}
  app:
    internal: true
    ipam:
      config:
        - subnet: ${APP_SUBNET:?APP_SUBNET 未設定}
  data:
    internal: true

volumes:
  pgdata: {}
  caddy_data: {}
