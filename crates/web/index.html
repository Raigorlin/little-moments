<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="日子拾光 LITTLE MOMENTS：把平凡的日子，留成喜歡的回憶。旅行規劃與回憶收藏的本機應用。" />
    <title>日子拾光 · LITTLE MOMENTS</title>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-cargo-profile-release="wasm-release" />
    <!-- 樣式順序同 Bun：styles.css → accounts.css → scene-motion 版面規則 → expenses.css。
         styles.css 與 Bun 逐字相同，含 :root[data-theme=dark] 規則；根元素有 data-theme="dark" 時套用深色主題，
         沒有 data-theme 時為淺色主題（schedule-tab-css-parity 需求 6）。此處不設定 data-theme；
         src/theme.rs 依 localStorage 的 ggc-local-theme 設定它（同 Bun）。 -->
    <link data-trunk rel="css" href="styles/styles.css" data-no-minify />
    <link data-trunk rel="css" href="styles/accounts.css" data-no-minify />
    <link data-trunk rel="css" href="styles/scene-motion-layout.css" data-no-minify />
    <link data-trunk rel="css" href="styles/expenses.css" data-no-minify />
    <!-- 第一版唯一新增的樣式檔：Editor_Stack 與 Editor_Avatar（需求 32.8） -->
    <link data-trunk rel="css" href="styles/presence.css" data-no-minify />
    <!-- 採買清單：往右滑切換已買的標示與「已買齊」收合區（styles.css 須與 Bun 相同，所以另放一檔） -->
    <link data-trunk rel="css" href="styles/shopping-swipe.css" data-no-minify />
    <!-- 料理菜單：在餐次卡片裡編輯時，表單占滿卡片寬度（styles.css 須與 Bun 相同，所以另放一檔） -->
    <link data-trunk rel="css" href="styles/meal-edit.css" data-no-minify />
    <!-- 行程表的旅行繪本工作室：頁面版面與 Patrick Hand 字型，與 Bun 的 src/storybook-host.css 逐字相同。工作室本身的樣式
         （styles/storybook-studio.css，與 src/storybook/style.css 逐字相同）放在工作室的 Shadow Root 中，不在這裡連結。 -->
    <link data-trunk rel="css" href="styles/storybook-host.css" data-no-minify />
    <!-- 字型子集與授權檔；styles.css 的 @font-face 以 ./assets/fonts/… 引用 -->
    <link data-trunk rel="copy-dir" href="../../assets/fonts" data-target-path="assets/fonts" />
    <!-- storybook-host.css 的 @font-face 以 /assets/storybook/fonts/PatrickHand-32c1a2bb.woff2 引用 -->
    <link data-trunk rel="copy-dir" href="../../assets/storybook/fonts" data-target-path="assets/storybook/fonts" />
    <!-- 搜尋引擎與 AI 代理讀取的 /robots.txt、/llms.txt；沒有這兩個檔時 lm-server 回傳 index.html -->
    <link data-trunk rel="copy-file" href="public/robots.txt" />
    <link data-trunk rel="copy-file" href="public/llms.txt" />
  </head>
  <body></body>
</html>
